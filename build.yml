name: Build mod

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Get AML headers + ImGui
        run: |
          git clone --depth 1 https://github.com/RusJJ/AndroidModLoader AML
          git clone --depth 1 --branch v1.90.9 https://github.com/ocornut/imgui imgui

      - name: Compile
        run: |
          "$ANDROID_NDK_LATEST_HOME/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk -j4

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: SAModMenu
          path: libs/armeabi-v7a/libModMenu.so
